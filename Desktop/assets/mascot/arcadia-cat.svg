<?xml version="1.0" encoding="UTF-8"?>
<!--
  Arcadia mascot — vector master for animation.
  Layer order = paint order. Each movable region has an id for AE / Rive / Lottie / code.

  Suggested rigs: root squash at (256, 420); ear pivots at inner-base; tail pivot at rump;
  pupils translate inside clip; blink = scaleY on eye-white groups.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="fur-grad" cx="38%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#f0dcc0"/>
      <stop offset="45%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#9e7349"/>
    </radialGradient>
    <radialGradient id="belly-grad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#e8d4bc"/>
    </radialGradient>
    <radialGradient id="iris-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ecfae"/>
      <stop offset="55%" stop-color="#2a9d7a"/>
      <stop offset="100%" stop-color="#135a47"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a0d2e" flood-opacity="0.22"/>
    </filter>
    <clipPath id="eye-clip-left">
      <ellipse cx="218" cy="210" rx="46" ry="50"/>
    </clipPath>
    <clipPath id="eye-clip-right">
      <ellipse cx="294" cy="210" rx="46" ry="50"/>
    </clipPath>
  </defs>

  <g id="arcadia-cat" filter="url(#soft-shadow)">

    <!-- Tail: pivot at body attachment. Animate: rotate this group. -->
    <g id="tail-pivot" transform="translate(318 298)">
      <g id="tail" transform="translate(-318 -298)">
        <path fill="#8b6346" stroke="#3d2918" stroke-width="2.5" stroke-linejoin="round"
          d="M315 300 C360 285 405 210 418 145 C428 90 410 75 385 85 C370 160 340 235 300 275 C292 285 308 298 315 300 Z"/>
        <path fill="#a67c52" stroke="none" opacity="0.5"
          d="M322 302 C352 292 388 228 398 168 C404 130 392 102 372 112 C382 175 352 242 308 278 C300 286 312 298 322 302 Z"/>
      </g>
    </g>

    <!-- Torso + head base fur (stacked ellipses read as one mass; animate body/head separately). -->
    <g id="body-fur">
      <ellipse cx="256" cy="312" rx="118" ry="128" fill="url(#fur-grad)" stroke="#3d2918" stroke-width="2.5"/>
    </g>
    <g id="head-fur">
      <ellipse cx="256" cy="196" rx="100" ry="86" fill="url(#fur-grad)" stroke="#3d2918" stroke-width="2.5"/>
    </g>

    <g id="belly-patch">
      <ellipse cx="256" cy="330" rx="72" ry="88" fill="url(#belly-grad)" stroke="#c4a882" stroke-width="1.5" opacity="0.95"/>
    </g>

    <g id="tabby-markings" fill="#5c4033" stroke="#3d2918" stroke-width="1.2" opacity="0.92">
      <ellipse cx="200" cy="268" rx="22" ry="20"/>
      <ellipse cx="312" cy="268" rx="22" ry="20"/>
      <ellipse cx="256" cy="352" rx="18" ry="16"/>
      <path stroke-linecap="round" stroke-width="5" stroke="#5c4033" fill="none" opacity="0.85"
        d="M228 152c8-14 16-14 24 0M244 146c6-16 12-16 18 0M260 146c6-16 12-16 18 0"/>
    </g>

    <g id="muzzle">
      <ellipse cx="256" cy="232" rx="56" ry="44" fill="#faf3e8" stroke="#d8c4a8" stroke-width="1.5"/>
    </g>

    <!-- Ears: pivots at inner corner toward head center. -->
    <g id="ear-left-pivot" transform="translate(186 138)">
      <g id="ear-left" transform="translate(-186 -138)">
        <path fill="url(#fur-grad)" stroke="#3d2918" stroke-width="2.5" stroke-linejoin="round"
          d="M186 138c-32-42-52-38-58 8-2 18 8 34 24 40l34-48z"/>
        <path fill="#f4a4b8" stroke="#c97d8f" stroke-width="1.2" opacity="0.95"
          d="M172 148c-14-18-22-16-24 4-1 10 4 18 12 22l12-26z"/>
      </g>
    </g>
    <g id="ear-right-pivot" transform="translate(326 138)">
      <g id="ear-right" transform="translate(-326 -138)">
        <path fill="url(#fur-grad)" stroke="#3d2918" stroke-width="2.5" stroke-linejoin="round"
          d="M326 138c32-42 52-38 58 8 2 18-8 34-24 40l-34-48z"/>
        <path fill="#f4a4b8" stroke="#c97d8f" stroke-width="1.2" opacity="0.95"
          d="M340 148c14-18 22-16 24 4 1 10-4 18-12 22l-12-26z"/>
      </g>
    </g>

    <!-- Eyes -->
    <g id="eyes">
      <g id="eye-left">
        <ellipse id="eye-left-white" cx="218" cy="210" rx="44" ry="48" fill="#fefefe" stroke="#3d2918" stroke-width="2.2"/>
        <g clip-path="url(#eye-clip-left)">
          <g id="eye-left-iris-group">
            <ellipse cx="218" cy="212" rx="30" ry="34" fill="url(#iris-grad)"/>
            <ellipse id="eye-left-pupil" cx="218" cy="214" rx="14" ry="16" fill="#0d1110"/>
            <ellipse cx="228" cy="204" rx="9" ry="10" fill="#ffffff" opacity="0.55"/>
            <circle cx="210" cy="222" r="4.5" fill="#ffffff" opacity="0.9"/>
          </g>
        </g>
      </g>
      <g id="eye-right">
        <ellipse id="eye-right-white" cx="294" cy="210" rx="44" ry="48" fill="#fefefe" stroke="#3d2918" stroke-width="2.2"/>
        <g clip-path="url(#eye-clip-right)">
          <g id="eye-right-iris-group">
            <ellipse cx="294" cy="212" rx="30" ry="34" fill="url(#iris-grad)"/>
            <ellipse id="eye-right-pupil" cx="294" cy="214" rx="14" ry="16" fill="#0d1110"/>
            <ellipse cx="304" cy="204" rx="9" ry="10" fill="#ffffff" opacity="0.55"/>
            <circle cx="286" cy="222" r="4.5" fill="#ffffff" opacity="0.9"/>
          </g>
        </g>
      </g>
    </g>

    <g id="nose" transform="translate(256 248)">
      <path fill="#f4a4b8" stroke="#c97d8f" stroke-width="1.3" stroke-linejoin="round"
        transform="translate(-256 -248)"
        d="M256 236l10 14h-20l10-14z"/>
    </g>
    <g id="mouth" stroke="#3d2918" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M256 252c-12 10-24 8-32-2M256 252c12 10 24 8 32-2"/>
    </g>

    <g id="whiskers-left" stroke="#fff9f4" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.82">
      <line x1="210" y1="238" x2="118" y2="228"/>
      <line x1="208" y1="248" x2="112" y2="248"/>
      <line x1="210" y1="258" x2="120" y2="268"/>
    </g>
    <g id="whiskers-right" stroke="#fff9f4" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.82">
      <line x1="302" y1="238" x2="394" y2="228"/>
      <line x1="304" y1="248" x2="400" y2="248"/>
      <line x1="302" y1="258" x2="392" y2="268"/>
    </g>

    <!-- Forepaws in front of body -->
    <g id="paws">
      <ellipse id="paw-left" cx="214" cy="318" rx="36" ry="40" fill="url(#fur-grad)" stroke="#3d2918" stroke-width="2.5"/>
      <ellipse id="paw-right" cx="298" cy="318" rx="36" ry="40" fill="url(#fur-grad)" stroke="#3d2918" stroke-width="2.5"/>
      <ellipse cx="214" cy="322" rx="12" ry="10" fill="#5c4033" opacity="0.35"/>
      <ellipse cx="298" cy="322" rx="12" ry="10" fill="#5c4033" opacity="0.35"/>
    </g>
  </g>
</svg>
