[package]
name = "arcadia"
version = "0.1.0"
edition = "2021"
description = "Arcadia launcher base application"
license = "MIT"

[features]
default = ["headless"]
headless = []
gui-any = ["dep:openframe", "dep:image"]
gui     = ["gui-any", "dep:libc", "dep:portable-pty", "dep:vt100", "dep:global-hotkey", "dep:tray-icon", "dep:device_query", "dep:display-info", "python-extensions", "llama-cpp"]
ios-gui = ["gui-any"]
python-extensions = ["dep:arcadia-python"]
llama-cpp = ["dep:llama-cpp-2"]

[[bin]]
name = "arcadia"
path = "src/main.rs"

[lib]
name = "arcadia_ios"
crate-type = ["staticlib"]
path = "src/ios_lib.rs"

[dependencies]
arcadia-core     = { path = "../Shared/ArcadiaCore" }
arcadia-python   = { path = "../Shared/ArcadiaPython", optional = true }
serde_json       = "1"
openframe        = { path = "../Libraries/OpenFrame", optional = true }
image            = { version = "0.25.1", optional = true }
global-hotkey    = { version = "0.8", optional = true }
libc             = { version = "0.2", optional = true }
rustyline        = "18.0.0"
portable-pty     = { version = "0.8", optional = true }
vt100            = { version = "0.15", optional = true }
tray-icon        = { version = "0.19", optional = true }
device_query     = { version = "4", optional = true }
display-info     = { version = "0.5", optional = true }
llama-cpp-2      = { version = "0.1", optional = true, features = ["metal"] }
ureq             = { version = "2", features = ["json"] }
include_dir      = "0.7"
